<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY DAY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   기본
========================================================= */

* {
    box-sizing: border-box;
}

:root {
    --bg: #101827;
    --panel: rgba(25, 38, 55, 0.78);
    --panel-strong: rgba(18, 29, 43, 0.92);
    --border: rgba(255, 255, 255, 0.12);

    --text: #f7f9fc;
    --muted: #a7b3c4;

    --green: #79f7ad;
    --cyan: #65dcff;
    --purple: #a78bfa;
    --orange: #ffbd7a;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    color: var(--text);

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    overflow-x: hidden;

    background:
        radial-gradient(
            700px 450px at 5% 5%,
            rgba(255, 190, 130, 0.25),
            transparent 65%
        ),

        radial-gradient(
            650px 450px at 95% 10%,
            rgba(90, 210, 255, 0.25),
            transparent 65%
        ),

        radial-gradient(
            650px 500px at 50% 55%,
            rgba(150, 120, 255, 0.18),
            transparent 70%
        ),

        radial-gradient(
            600px 400px at 20% 100%,
            rgba(70, 240, 180, 0.13),
            transparent 70%
        ),

        linear-gradient(
            135deg,
            #16263a 0%,
            #172d43 35%,
            #202b4a 65%,
            #172638 100%
        );
}

/* 배경 빛 */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(255,255,255,0.06),
            transparent 25%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(255,255,255,0.05),
            transparent 25%
        );

    filter: blur(20px);

    z-index: -1;
}

/* 배경 별 */

body::after {
    content:
        "✦     ·        ✧       ·     ✦       ·        ✧       ·";

    position: fixed;

    top: 50px;
    left: 0;

    width: 100%;

    color: rgba(255,255,255,0.28);

    font-size: 14px;
    letter-spacing: 18px;

    pointer-events: none;

    z-index: -1;
}


/* =========================================================
   전체 컨테이너
========================================================= */

.container {
    width: 100%;
    max-width: 1050px;

    margin: auto;

    padding:
        25px 18px 70px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.logo {
    font-size: 25px;

    font-weight: bold;

    letter-spacing: 4px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            var(--green),
            var(--cyan)
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.user-area {
    display: flex;

    align-items: center;

    gap: 10px;
}

.user-email {
    color: var(--muted);

    font-size: 12px;
}

.logout {
    background:
        rgba(27,35,44,.65);

    color: white;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 10px;

    padding: 8px 12px;

    cursor: pointer;

    transition: .2s;

    backdrop-filter: blur(10px);
}

.logout:hover {
    transform: translateY(-1px);

    border-color:
        rgba(114,245,164,.35);
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 15%,
            rgba(255, 210, 130, 0.32),
            transparent 25%
        ),

        radial-gradient(
            circle at 10% 90%,
            rgba(70, 220, 255, 0.20),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(170, 120, 255, 0.22),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #21435b,
            #31516c 45%,
            #3c456d
        );

    border:
        1px solid rgba(255,255,255,0.16);

    border-radius: 28px;

    padding:
        42px 35px 35px;

    text-align: center;

    margin-bottom: 18px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.12);
}

/* HERO 가운데 빛 */

.hero::before {
    content: "";

    position: absolute;

    width: 350px;
    height: 220px;

    left: 50%;
    top: -100px;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,220,150,0.35),
            transparent 70%
        );

    filter: blur(30px);

    pointer-events: none;
}

/* HERO 별 */

.hero::after {
    content:
        "✦   ·   ✧      ·      ✦      ·   ✧";

    position: absolute;

    top: 18px;
    left: 0;

    width: 100%;

    color:
        rgba(255,255,255,0.45);

    font-size: 13px;

    letter-spacing: 12px;

    pointer-events: none;
}

.small-title {
    position: relative;

    color: #b5c8c7;

    font-size: 11px;

    letter-spacing: 4px;

    z-index: 1;
}

.score {
    position: relative;

    font-size: 90px;

    font-weight: 800;

    line-height: 1;

    color: transparent;

    background:
        linear-gradient(
            135deg,
            #d0ffdf,
            #79f7ad,
            #5ce6d0
        );

    -webkit-background-clip: text;
    background-clip: text;

    text-shadow:
        0 0 40px rgba(114,245,164,0.25);

    margin:
        14px 0 8px;

    z-index: 1;
}

.message {
    position: relative;

    font-size: 18px;

    color: #eef5f5;

    z-index: 1;
}


/* =========================================================
   버튼
========================================================= */

.main-button,
.save-button,
.auth-button {

    width: 100%;

    border: none;

    background:
        linear-gradient(
            135deg,
            #79f7ad,
            #62e8d0
        );

    color: #07100b;

    font-weight: bold;

    padding: 16px;

    border-radius: 14px;

    cursor: pointer;

    font-size: 16px;

    box-shadow:
        0 10px 30px
        rgba(80,230,175,0.20);

    transition:
        transform .2s,
        box-shadow .2s,
        filter .2s;
}

.main-button:hover,
.save-button:hover,
.auth-button:hover {

    transform: translateY(-2px);

    filter: brightness(1.05);

    box-shadow:
        0 15px 35px
        rgba(80,230,175,0.30);
}

.main-button {
    position: relative;

    margin-top: 22px;

    z-index: 1;
}


/* =========================================================
   카드
========================================================= */

.cards {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.card,
.stat,
.chart,
.history-item {

    background:
        linear-gradient(
            145deg,
            rgba(36,52,70,0.82),
            rgba(18,29,43,0.78)
        );

    border:
        1px solid rgba(255,255,255,0.10);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.055);

    backdrop-filter:
        blur(16px);
}

.card {

    border-radius: 20px;

    padding: 20px;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.card:hover {

    transform:
        translateY(-5px);

    border-color:
        rgba(121,247,173,0.30);

    box-shadow:
        0 20px 45px
        rgba(0,0,0,0.25),

        0 0 25px
        rgba(121,247,173,0.06);
}

.icon {
    font-size: 25px;
}

.card-title {
    color: var(--muted);

    font-size: 13px;

    margin-top: 8px;
}

.value {
    font-size: 23px;

    font-weight: bold;

    margin-top: 5px;
}


/* =========================================================
   SECTION
========================================================= */

.section {
    margin-top: 30px;
}

.section h2 {
    font-size: 19px;
}


/* =========================================================
   STATS
========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}

.stat {

    border-radius: 18px;

    padding: 18px;
}

.stat-title {
    color: var(--muted);

    font-size: 12px;
}

.stat-value {

    font-size: 25px;

    font-weight: bold;

    margin-top: 8px;

    color: var(--green);
}


/* =========================================================
   CHART
========================================================= */

.chart {

    border-radius: 20px;

    padding: 22px;
}

.chart-row {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 12px 0;
}

.chart-date {

    width: 65px;

    color: #aab5c3;

    font-size: 12px;
}

.chart-bar {

    flex: 1;

    height: 28px;

    background:
        rgba(255,255,255,0.08);

    border-radius: 8px;

    overflow: hidden;
}

.chart-inner {

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #55d7bc,
            #79f7ad,
            #b0ffc8
        );

    border-radius: 8px;

    box-shadow:
        0 0 18px
        rgba(121,247,173,0.25);
}

.chart-score {

    width: 35px;

    text-align: right;

    font-size: 12px;
}


/* =========================================================
   HISTORY
========================================================= */

.history {

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.history-item {

    border-radius: 16px;

    padding: 16px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.history-date {

    color: #aab5c3;

    font-size: 13px;
}

.history-note {

    margin-top: 5px;

    color: #dce2e9;

    font-size: 14px;
}

.history-score {

    font-size: 25px;

    font-weight: bold;

    color: var(--green);
}

.empty {

    color: #8795a7;

    text-align: center;

    padding: 25px;
}


/* =========================================================
   INSIGHT
========================================================= */

.insight {

    background:

        radial-gradient(
            circle at 100% 0%,
            rgba(121,247,173,0.18),
            transparent 35%
        ),

        radial-gradient(
            circle at 0% 100%,
            rgba(100,200,255,0.12),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            rgba(30,55,48,0.88),
            rgba(20,31,43,0.85)
        );

    border:
        1px solid
        rgba(121,247,173,0.22);

    border-radius: 20px;

    padding: 25px;

    box-shadow:
        0 14px 40px
        rgba(0,0,0,.16);
}

.insight-title {

    color: var(--green);

    font-weight: bold;

    margin-bottom: 10px;
}

.insight-text {

    color: #d6dce3;

    line-height: 1.7;
}


/* =========================================================
   AUTH
========================================================= */

.auth-screen {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.auth-box {

    width: 100%;

    max-width: 420px;

    background:
        rgba(22,35,50,.82);

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 25px;

    padding: 30px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.35);

    backdrop-filter:
        blur(18px);
}

.auth-logo {

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    letter-spacing: 5px;

    margin-bottom: 10px;

    background:
        linear-gradient(
            90deg,
            #fff,
            var(--green),
            var(--cyan)
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.auth-subtitle {

    text-align: center;

    color: var(--muted);

    margin-bottom: 25px;
}

.auth-input {

    width: 100%;

    padding: 14px;

    margin-bottom: 12px;

    background:
        rgba(8,11,15,.60);

    border:
        1px solid #344253;

    border-radius: 10px;

    color: white;

    font-size: 15px;

    outline: none;
}

.auth-input:focus,
.field input:focus,
.field textarea:focus {

    border-color:
        rgba(114,245,164,.55);

    box-shadow:
        0 0 0 3px
        rgba(114,245,164,.08);
}

.auth-button {
    margin-top: 5px;
}

.auth-switch {

    text-align: center;

    color: var(--muted);

    margin-top: 18px;

    cursor: pointer;

    font-size: 14px;
}

.auth-message {

    color: var(--green);

    text-align: center;

    margin-top: 15px;

    line-height: 1.5;
}

.auth-error {

    color: #ff7777;

    text-align: center;

    margin-top: 15px;

    line-height: 1.5;
}


/* =========================================================
   MODAL
========================================================= */

.modal-bg {

    position: fixed;

    inset: 0;

    background:
        rgba(5,10,18,.72);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 100;
}

.modal {

    width: 100%;

    max-width: 520px;

    background:
        rgba(20,31,45,.94);

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 24px;

    padding: 25px;

    max-height: 90vh;

    overflow-y: auto;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(18px);
}

.modal-header {

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.modal-header h2 {
    margin: 0;
}

.close {

    background: none;

    border: none;

    color: white;

    font-size: 28px;

    cursor: pointer;
}

.field {
    margin-top: 18px;
}

.field label {

    display: block;

    color: #aab5c3;

    font-size: 13px;

    margin-bottom: 7px;
}

.field input,
.field textarea {

    width: 100%;

    padding: 13px;

    background:
        rgba(8,11,15,.60);

    border:
        1px solid #344253;

    border-radius: 10px;

    color: white;

    font-size: 15px;

    outline: none;
}

.field textarea {

    min-height: 80px;

    resize: vertical;
}

.range-row {

    display: flex;

    gap: 10px;

    align-items: center;
}

.range-row input {

    flex: 1;

    accent-color:
        var(--green);
}

.range-number {

    width: 45px;

    text-align: center;

    color: var(--green);

    font-weight: bold;
}

.save-button {

    margin-top: 25px;
}


/* =========================================================
   반응형
========================================================= */

@media(max-width: 800px) {

    .stats {
        grid-template-columns:
            repeat(2, 1fr);
    }
}

@media(max-width: 700px) {

    .cards {
        grid-template-columns:
            repeat(2,1fr);
    }

    .score {
        font-size: 70px;
    }

    .user-email {
        display: none;
    }
}

@media(max-width: 450px) {

    .cards {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns:
            1fr 1fr;
    }

    .hero {
        padding:
            30px 15px;
    }
}

</style>
</head>


<body>

<!-- =====================================================
     로그인 화면
===================================================== -->

<div id="authScreen" class="auth-screen">

    <div class="auth-box">

        <div class="auth-logo">
            MY DAY
        </div>

        <div class="auth-subtitle">
            오늘의 나를 기록하세요
        </div>

        <input
            id="email"
            class="auth-input"
            type="email"
            placeholder="이메일"
        >

        <input
            id="password"
            class="auth-input"
            type="password"
            placeholder="비밀번호"
        >

        <button
            class="auth-button"
            onclick="login()"
        >
            로그인
        </button>

        <div
            class="auth-switch"
            onclick="signup()"
        >
            계정이 없나요? 회원가입
        </div>

        <div
            id="authMessage"
            class="auth-message"
        ></div>

        <div
            id="authError"
            class="auth-error"
        ></div>

    </div>

</div>


<!-- =====================================================
     메인 화면
===================================================== -->

<div
    id="mainScreen"
    style="display:none;"
>

<div class="container">


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            MY DAY
        </div>

        <div class="user-area">

            <div
                id="userEmail"
                class="user-email"
            ></div>

            <button
                class="logout"
                onclick="logout()"
            >
                로그아웃
            </button>

        </div>

    </header>


    <!-- =================================================
         HERO
    ================================================== -->

    <section class="hero">

        <div class="small-title">
            TODAY'S SCORE
        </div>

        <div
            id="todayScore"
            class="score"
        >
            0
        </div>

        <div
            id="todayMessage"
            class="message"
        >
            오늘 하루를 기록해보세요
        </div>

        <button
            class="main-button"
            onclick="openModal()"
        >
            오늘 기록하기
        </button>

    </section>


    <!-- =================================================
         오늘의 카드
    ================================================== -->

    <section class="cards">

        <div class="card">

            <div class="icon">
                ☀️
            </div>

            <div class="card-title">
                기분
            </div>

            <div
                id="todayMood"
                class="value"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">
                ⚡
            </div>

            <div class="card-title">
                에너지
            </div>

            <div
                id="todayEnergy"
                class="value"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">
                🧠
            </div>

            <div class="card-title">
                집중력
            </div>

            <div
                id="todayFocus"
                class="value"
            >
                -
            </div>

        </div>

    </section>


    <!-- =================================================
         통계
    ================================================== -->

    <section class="section">

        <h2>
            나의 기록
        </h2>

        <div class="stats">

            <div class="stat">

                <div class="stat-title">
                    평균 점수
                </div>

                <div
                    id="averageScore"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    최고 점수
                </div>

                <div
                    id="bestScore"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    기록 일수
                </div>

                <div
                    id="recordDays"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    연속 기록
                </div>

                <div
                    id="streak"
                    class="stat-value"
                >
                    0
                </div>

            </div>

        </div>

    </section>


    <!-- =================================================
         그래프
    ================================================== -->

    <section class="section">

        <h2>
            최근 기록
        </h2>

        <div
            id="chart"
            class="chart"
        ></div>

    </section>


    <!-- =================================================
         MY INSIGHT
    ================================================== -->

    <section class="section">

        <div class="insight">

            <div class="insight-title">
                ✨ MY INSIGHT
            </div>

            <div
                id="insightText"
                class="insight-text"
            >
                아직 충분한 기록이 없어요.
                조금씩 기록을 쌓아보세요.
            </div>

        </div>

    </section>


    <!-- =================================================
         기록
    ================================================== -->

    <section class="section">

        <h2>
            지난 기록
        </h2>

        <div
            id="history"
            class="history"
        ></div>

    </section>


</div>

</div>


<!-- =====================================================
     기록 입력 MODAL
===================================================== -->

<div
    id="modalBg"
    class="modal-bg"
>

    <div class="modal">

        <div class="modal-header">

            <h2>
                오늘의 기록
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <!-- 기분 -->

        <div class="field">

            <label>
                오늘 기분은 어땠나요?
            </label>

            <div class="range-row">

                <input
                    id="mood"
                    type="range"
                    min="1"
                    max="10"
                    value="5"
                    oninput="updateRange('mood')"
                >

                <div
                    id="moodNumber"
                    class="range-number"
                >
                    5
                </div>

            </div>

        </div>


        <!-- 에너지 -->

        <div class="field">

            <label>
                오늘 에너지는?
            </label>

            <div class="range-row">

                <input
                    id="energy"
                    type="range"
                    min="1"
                    max="10"
                    value="5"
                    oninput="updateRange('energy')"
                >

                <div
                    id="energyNumber"
                    class="range-number"
                >
                    5
                </div>

            </div>

        </div>


        <!-- 집중력 -->

        <div class="field">

            <label>
                오늘 집중력은?
            </label>

            <div class="range-row">

                <input
                    id="focus"
                    type="range"
                    min="1"
                    max="10"
                    value="5"
                    oninput="updateRange('focus')"
                >

                <div
                    id="focusNumber"
                    class="range-number"
                >
                    5
                </div>

            </div>

        </div>


        <!-- 메모 -->

        <div class="field">

            <label>
                오늘 하루 한마디
            </label>

            <textarea
                id="note"
                placeholder="오늘 있었던 일을 자유롭게 적어보세요"
            ></textarea>

        </div>


        <button
            class="save-button"
            onclick="saveToday()"
        >
            오늘 기록 저장하기
        </button>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE 설정
========================================================= */

/*
   기존에 사용하던 Supabase URL과 ANON KEY를
   아래에 그대로 넣어주세요.
*/

const SUPABASE_URL =
    "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   로그인
========================================================= */

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("authError");

    const message =
        document.getElementById("authMessage");

    error.innerText = "";
    message.innerText = "";

    if (!email || !password) {

        error.innerText =
            "이메일과 비밀번호를 입력해주세요.";

        return;
    }

    const { data, error: loginError } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (loginError) {

        error.innerText =
            loginError.message;

        return;
    }

    if (data.user) {

        showMainScreen(
            data.user
        );
    }
}


/* =========================================================
   회원가입
========================================================= */

async function signup() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("authError");

    const message =
        document.getElementById("authMessage");

    error.innerText = "";
    message.innerText = "";

    if (!email || !password) {

        error.innerText =
            "이메일과 비밀번호를 입력해주세요.";

        return;
    }

    if (password.length < 6) {

        error.innerText =
            "비밀번호는 6자 이상이어야 합니다.";

        return;
    }

    const { error: signupError } =
        await supabaseClient.auth.signUp({
            email,
            password
        });

    if (signupError) {

        error.innerText =
            signupError.message;

        return;
    }

    message.innerText =
        "회원가입이 완료되었습니다. 이메일을 확인해주세요.";
}


/* =========================================================
   로그아웃
========================================================= */

async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById(
        "mainScreen"
    ).style.display = "none";

    document.getElementById(
        "authScreen"
    ).style.display = "flex";
}


/* =========================================================
   화면 전환
========================================================= */

function showMainScreen(user) {

    document.getElementById(
        "authScreen"
    ).style.display = "none";

    document.getElementById(
        "mainScreen"
    ).style.display = "block";

    document.getElementById(
        "userEmail"
    ).innerText = user.email;

    loadData();
}


/* =========================================================
   모달
========================================================= */

function openModal() {

    document.getElementById(
        "modalBg"
    ).style.display = "flex";
}

function closeModal() {

    document.getElementById(
        "modalBg"
    ).style.display = "none";
}


/* =========================================================
   RANGE
========================================================= */

function updateRange(type) {

    const value =
        document.getElementById(type).value;

    document.getElementById(
        type + "Number"
    ).innerText = value;
}


/* =========================================================
   오늘 기록 저장
========================================================= */

async function saveToday() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        alert("로그인이 필요합니다.");

        return;
    }

    const mood =
        Number(
            document.getElementById("mood").value
        );

    const energy =
        Number(
            document.getElementById("energy").value
        );

    const focus =
        Number(
            document.getElementById("focus").value
        );

    const note =
        document.getElementById("note").value.trim();

    const score =
        Math.round(
            ((mood + energy + focus) / 30) * 100
        );

    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    const { error } =
        await supabaseClient
            .from("daily_records")
            .upsert(
                {
                    user_id: user.id,
                    date: today,
                    mood,
                    energy,
                    focus,
                    score,
                    note
                },
                {
                    onConflict:
                        "user_id,date"
                }
            );

    if (error) {

        alert(
            "저장 중 오류가 발생했습니다.\n" +
            error.message
        );

        return;
    }

    closeModal();

    await loadData();
}


/* =========================================================
   데이터 불러오기
========================================================= */

async function loadData() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) return;


    const { data, error } =
        await supabaseClient
            .from("daily_records")
            .select("*")
            .eq("user_id", user.id)
            .order("date", {
                ascending: false
            });

    if (error) {

        console.error(error);

        return;
    }


    renderToday(data || []);

    renderStats(data || []);

    renderChart(data || []);

    renderHistory(data || []);

    renderInsight(data || []);
}


/* =========================================================
   오늘 데이터
========================================================= */

function renderToday(records) {

    const today =
        new Date()
            .toISOString()
            .split("T")[0];

    const record =
        records.find(
            item => item.date === today
        );

    if (!record) {

        document.getElementById(
            "todayScore"
        ).innerText = "0";

        document.getElementById(
            "todayMood"
        ).innerText = "-";

        document.getElementById(
            "todayEnergy"
        ).innerText = "-";

        document.getElementById(
            "todayFocus"
        ).innerText = "-";

        document.getElementById(
            "todayMessage"
        ).innerText =
            "오늘 하루를 기록해보세요";

        return;
    }


    document.getElementById(
        "todayScore"
    ).innerText =
        record.score;


    document.getElementById(
        "todayMood"
    ).innerText =
        record.mood + " / 10";


    document.getElementById(
        "todayEnergy"
    ).innerText =
        record.energy + " / 10";


    document.getElementById(
        "todayFocus"
    ).innerText =
        record.focus + " / 10";


    document.getElementById(
        "todayMessage"
    ).innerText =
        getScoreMessage(record.score);
}


/* =========================================================
   점수 메시지
========================================================= */

function getScoreMessage(score) {

    if (score >= 90) {
        return "오늘 정말 멋진 하루였어요 ✨";
    }

    if (score >= 75) {
        return "오늘 하루 꽤 잘 보냈어요 🌿";
    }

    if (score >= 60) {
        return "괜찮은 하루였어요 🙂";
    }

    if (score >= 40) {
        return "오늘은 조금 쉬어가도 좋아요 🌙";
    }

    return "오늘도 버틴 것만으로 충분해요 💚";
}


/* =========================================================
   통계
========================================================= */

function renderStats(records) {

    if (!records.length) {

        document.getElementById(
            "averageScore"
        ).innerText = "0";

        document.getElementById(
            "bestScore"
        ).innerText = "0";

        document.getElementById(
            "recordDays"
        ).innerText = "0";

        document.getElementById(
            "streak"
        ).innerText = "0";

        return;
    }


    const scores =
        records.map(
            item => Number(item.score || 0)
        );


    const average =
        Math.round(
            scores.reduce(
                (a,b) => a+b,
                0
            ) / scores.length
        );


    const best =
        Math.max(...scores);


    document.getElementById(
        "averageScore"
    ).innerText =
        average;


    document.getElementById(
        "bestScore"
    ).innerText =
        best;


    document.getElementById(
        "recordDays"
    ).innerText =
        records.length;


    document.getElementById(
        "streak"
    ).innerText =
        calculateStreak(records);
}


/* =========================================================
   연속 기록
========================================================= */

function calculateStreak(records) {

    if (!records.length) return 0;

    const dates =
        records
            .map(
                item => item.date
            )
            .sort()
            .reverse();


    let streak = 1;


    for (let i = 0; i < dates.length - 1; i++) {

        const current =
            new Date(dates[i]);

        const next =
            new Date(dates[i + 1]);


        const diff =
            (
                current - next
            ) /
            (
                1000 * 60 * 60 * 24
            );


        if (diff === 1) {

            streak++;

        } else {

            break;
        }
    }


    return streak;
}


/* =========================================================
   그래프
========================================================= */

function renderChart(records) {

    const chart =
        document.getElementById("chart");


    if (!records.length) {

        chart.innerHTML =
            '<div class="empty">아직 기록이 없어요.</div>';

        return;
    }


    const recent =
        records
            .slice(0, 7)
            .reverse();


    chart.innerHTML =
        recent.map(record => {

            const width =
                Math.max(
                    5,
                    Number(record.score || 0)
                );


            return `
                <div class="chart-row">

                    <div class="chart-date">
                        ${formatDate(record.date)}
                    </div>

                    <div class="chart-bar">

                        <div
                            class="chart-inner"
                            style="width:${width}%"
                        ></div>

                    </div>

                    <div class="chart-score">
                        ${record.score}
                    </div>

                </div>
            `;

        }).join("");
}


/* =========================================================
   날짜
========================================================= */

function formatDate(dateString) {

    const date =
        new Date(dateString);

    return (
        (date.getMonth() + 1)
        + "/"
        +
        date.getDate()
    );
}


/* =========================================================
   기록 목록
========================================================= */

function renderHistory(records) {

    const history =
        document.getElementById(
            "history"
        );


    if (!records.length) {

        history.innerHTML =
            '<div class="empty">아직 기록이 없어요.</div>';

        return;
    }


    history.innerHTML =
        records.map(record => {

            return `
                <div class="history-item">

                    <div>

                        <div class="history-date">
                            ${record.date}
                        </div>

                        <div class="history-note">
                            ${
                                record.note ||
                                "오늘의 기록"
                            }
                        </div>

                    </div>

                    <div class="history-score">
                        ${record.score}
                    </div>

                </div>
            `;

        }).join("");
}


/* =========================================================
   INSIGHT
========================================================= */

function renderInsight(records) {

    const element =
        document.getElementById(
            "insightText"
        );


    if (records.length < 3) {

        element.innerText =
            "조금 더 기록하면 나만의 패턴과 컨디션 변화를 분석해드릴게요.";

        return;
    }


    const averageMood =
        records.reduce(
            (sum, item) =>
                sum + Number(item.mood || 0),
            0
        ) / records.length;


    const averageEnergy =
        records.reduce(
            (sum, item) =>
                sum + Number(item.energy || 0),
            0
        ) / records.length;


    const averageFocus =
        records.reduce(
            (sum, item) =>
                sum + Number(item.focus || 0),
            0
        ) / records.length;


    const values = [
        {
            name: "기분",
            value: averageMood
        },
        {
            name: "에너지",
            value: averageEnergy
        },
        {
            name: "집중력",
            value: averageFocus
        }
    ];


    values.sort(
        (a,b) =>
            b.value - a.value
    );


    const best =
        values[0];

    const lowest =
        values[values.length - 1];


    element.innerText =
        `최근 기록을 보면 ${best.name}이 가장 좋은 편이에요. ` +
        `반면 ${lowest.name}은 조금 더 신경 써주면 좋아 보여요. ` +
        `무리하지 않고 꾸준히 기록해보세요.`;
}


/* =========================================================
   세션 확인
========================================================= */

async function checkSession() {

    const {
        data: { session }
    } =
        await supabaseClient.auth.getSession();


    if (session && session.user) {

        showMainScreen(
            session.user
        );

    } else {

        document.getElementById(
            "authScreen"
        ).style.display = "flex";

        document.getElementById(
            "mainScreen"
        ).style.display = "none";
    }
}


/* =========================================================
   실행
========================================================= */

checkSession();


/* =========================================================
   ESC로 모달 닫기
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeModal();
        }

    }
);


/* =========================================================
   모달 바깥 클릭
========================================================= */

document
    .getElementById("modalBg")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeModal();
            }

        }
    );

</script>

</body>
</html>
