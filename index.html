<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY DAY</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b0f;
    color: #f5f7fa;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 25px 18px 60px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 4px;
}

.date {
    color: #8d9aaa;
    font-size: 13px;
}

.hero {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 25px;
    padding: 35px;
    text-align: center;
    margin-bottom: 18px;
}

.small-title {
    color: #8d9aaa;
    font-size: 12px;
    letter-spacing: 3px;
}

.score {
    font-size: 90px;
    font-weight: bold;
    color: #72f5a4;
    margin: 10px 0;
}

.message {
    font-size: 18px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.card {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 20px;
    padding: 20px;
}

.icon {
    font-size: 25px;
}

.card-title {
    color: #8d9aaa;
    font-size: 13px;
    margin-top: 8px;
}

.value {
    font-size: 23px;
    font-weight: bold;
    margin-top: 5px;
}

.section {
    margin-top: 30px;
}

.section h2 {
    font-size: 19px;
}

.chart {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 20px;
    padding: 22px;
}

.bar-label {
    color: #aab4c1;
    font-size: 13px;
    margin-top: 12px;
}

.bar {
    height: 28px;
    background: #1c252e;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 6px;
}

.bar-inner {
    height: 100%;
    background: #72f5a4;
    border-radius: 8px;
    transition: width .5s;
}

.main-button {
    width: 100%;
    border: none;
    background: #72f5a4;
    color: #07100b;
    font-weight: bold;
    padding: 16px;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 22px;
    font-size: 16px;
}

.main-button:hover {
    opacity: .85;
}


/* MODAL */

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 100;
}

.modal {
    width: 100%;
    max-width: 520px;

    background: #11161d;

    border: 1px solid #293440;

    border-radius: 24px;

    padding: 25px;

    max-height: 90vh;

    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
}

.close {
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
}

.field {
    margin-top: 18px;
}

.field label {
    display: block;
    color: #9aa6b5;
    font-size: 13px;
    margin-bottom: 7px;
}

.field input,
.field textarea {

    width: 100%;

    padding: 13px;

    background: #080b0f;

    border: 1px solid #28323d;

    border-radius: 10px;

    color: white;

    font-size: 15px;

}

.field textarea {
    min-height: 80px;
    resize: vertical;
}

.range-row {
    display: flex;
    gap: 10px;
    align-items: center;
}

.range-row input {
    flex: 1;
}

.range-number {
    width: 45px;
    text-align: center;
    color: #72f5a4;
    font-weight: bold;
}

.save-button {

    width: 100%;

    border: none;

    background: #72f5a4;

    color: #07100b;

    font-weight: bold;

    padding: 15px;

    border-radius: 12px;

    cursor: pointer;

    margin-top: 25px;

}

.empty {

    color: #718092;

    text-align: center;

    padding: 20px;

}


/* MOBILE */

@media(max-width:700px) {

    .cards {
        grid-template-columns: repeat(2,1fr);
    }

    .score {
        font-size: 70px;
    }

}

@media(max-width:450px) {

    .cards {
        grid-template-columns: 1fr;
    }

    .hero {
        padding: 25px 15px;
    }

}

</style>
</head>


<body>


<div class="container">


    <div class="header">

        <div class="logo">
            MY DAY
        </div>

        <div class="date" id="date">
        </div>

    </div>


    <!-- SCORE -->

    <div class="hero">

        <div class="small-title">
            TODAY SCORE
        </div>

        <div class="score" id="score">
            0
        </div>

        <div class="message" id="message">
            오늘의 데이터를 입력해보세요 🌱
        </div>

        <button class="main-button" onclick="openModal()">
            ＋ 오늘 기록하기
        </button>

    </div>


    <!-- METRICS -->

    <div class="cards">


        <div class="card">

            <div class="icon">
                😴
            </div>

            <div class="card-title">
                수면
            </div>

            <div class="value" id="sleepValue">
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">
                📚
            </div>

            <div class="card-title">
                공부
            </div>

            <div class="value" id="studyValue">
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">
                🏃
            </div>

            <div class="card-title">
                운동
            </div>

            <div class="value" id="exerciseValue">
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">
                😊
            </div>

            <div class="card-title">
                기분
            </div>

            <div class="value" id="moodValue">
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">
                ⚡
            </div>

            <div class="card-title">
                집중도
            </div>

            <div class="value" id="focusValue">
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">
                💰
            </div>

            <div class="card-title">
                오늘 지출
            </div>

            <div class="value" id="moneyValue">
                -
            </div>

        </div>


    </div>


    <!-- WEEK -->

    <div class="section">

        <h2>
            📊 이번 주
        </h2>

        <div class="chart">

            <div class="bar-label">
                월요일
            </div>

            <div class="bar">
                <div
                    class="bar-inner"
                    id="mon"
                    style="width:0%">
                </div>
            </div>


            <div class="bar-label">
                화요일
            </div>

            <div class="bar">
                <div
                    class="bar-inner"
                    id="tue"
                    style="width:0%">
                </div>
            </div>


            <div class="bar-label">
                수요일
            </div>

            <div class="bar">
                <div
                    class="bar-inner"
                    id="wed"
                    style="width:0%">
                </div>
            </div>


            <div class="bar-label">
                목요일
            </div>

            <div class="bar">
                <div
                    class="bar-inner"
                    id="thu"
                    style="width:0%">
                </div>
            </div>


            <div class="bar-label">
                금요일
            </div>

            <div class="bar">
                <div
                    class="bar-inner"
                    id="fri"
                    style="width:0%">
                </div>
            </div>

        </div>

    </div>


</div>


<!-- MODAL -->

<div
    class="modal-bg"
    id="modalBg"
>


<div class="modal">


    <div class="modal-header">

        <h2>
            오늘 기록하기
        </h2>

        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>

    </div>


    <div class="field">

        <label>
            수면 시간 (시간)
        </label>

        <input
            type="number"
            id="sleep"
            min="0"
            max="24"
            step="0.1"
            placeholder="예: 7.5"
        >

    </div>


    <div class="field">

        <label>
            공부 시간 (분)
        </label>

        <input
            type="number"
            id="study"
            min="0"
            placeholder="예: 120"
        >

    </div>


    <div class="field">

        <label>
            운동 시간 (분)
        </label>

        <input
            type="number"
            id="exercise"
            min="0"
            placeholder="예: 45"
        >

    </div>


    <div class="field">

        <label>
            오늘 지출 (원)
        </label>

        <input
            type="number"
            id="money"
            min="0"
            placeholder="예: 23000"
        >

    </div>


    <div class="field">

        <label>
            기분
        </label>

        <div class="range-row">

            <input
                type="range"
                min="0"
                max="100"
                value="70"
                id="mood"
                oninput="updateMood()"
            >

            <div
                class="range-number"
                id="moodNumber"
            >
                70
            </div>

        </div>

    </div>


    <div class="field">

        <label>
            집중도
        </label>

        <div class="range-row">

            <input
                type="range"
                min="0"
                max="100"
                value="70"
                id="focus"
                oninput="updateFocus()"
            >

            <div
                class="range-number"
                id="focusNumber"
            >
                70
            </div>

        </div>

    </div>


    <div class="field">

        <label>
            오늘 한마디
        </label>

        <textarea
            id="note"
            placeholder="오늘 하루는 어땠나요?"
        ></textarea>

    </div>


    <button
        class="save-button"
        onclick="saveData()"
    >
        저장하기
    </button>


</div>

</div>


<script>


/* 날짜 */

const today = new Date();

document.getElementById("date").innerText =
    today.toLocaleDateString(
        "ko-KR",
        {
            year: "numeric",
            month: "long",
            day: "numeric",
            weekday: "long"
        }
    );


/* MODAL */

function openModal() {

    document.getElementById("modalBg").style.display =
        "flex";

}


function closeModal() {

    document.getElementById("modalBg").style.display =
        "none";

}


/* RANGE */

function updateMood() {

    document.getElementById("moodNumber").innerText =
        document.getElementById("mood").value;

}


function updateFocus() {

    document.getElementById("focusNumber").innerText =
        document.getElementById("focus").value;

}


/* SCORE */

function calculateScore(
    sleep,
    study,
    exercise,
    mood,
    focus
) {

    let sleepScore =
        Math.min(
            100,
            Math.max(
                0,
                100 -
                Math.abs(8 - sleep) * 20
            )
        );


    let studyScore =
        Math.min(
            100,
            study / 180 * 100
        );


    let exerciseScore =
        Math.min(
            100,
            exercise / 60 * 100
        );


    let score =
        sleepScore * 0.2 +
        studyScore * 0.15 +
        exerciseScore * 0.15 +
        mood * 0.25 +
        focus * 0.25;


    return Math.round(score);

}


/* SAVE */

function saveData() {


    const sleep =
        Number(
            document.getElementById("sleep").value
        );


    const study =
        Number(
            document.getElementById("study").value
        );


    const exercise =
        Number(
            document.getElementById("exercise").value
        );


    const money =
        Number(
            document.getElementById("money").value
        );


    const mood =
        Number(
            document.getElementById("mood").value
        );


    const focus =
        Number(
            document.getElementById("focus").value
        );


    const note =
        document.getElementById("note").value;


    if (!sleep) {

        alert("수면 시간을 입력해주세요.");

        return;

    }


    const data = {

        sleep,
        study,
        exercise,
        money,
        mood,
        focus,
        note

    };


    localStorage.setItem(
        "myDayData",
        JSON.stringify(data)
    );


    updateScreen(data);


    closeModal();


    alert("오늘 기록이 저장되었습니다! 🌱");

}


/* SCREEN */

function updateScreen(data) {


    document.getElementById("sleepValue").innerText =
        data.sleep + "시간";


    document.getElementById("studyValue").innerText =
        data.study + "분";


    document.getElementById("exerciseValue").innerText =
        data.exercise + "분";


    document.getElementById("moodValue").innerText =
        data.mood + "점";


    document.getElementById("focusValue").innerText =
        data.focus + "점";


    document.getElementById("moneyValue").innerText =
        data.money.toLocaleString() + "원";


    const score =
        calculateScore(
            data.sleep,
            data.study,
            data.exercise,
            data.mood,
            data.focus
        );


    document.getElementById("score").innerText =
        score;


    if (score >= 90) {

        document.getElementById("message").innerText =
            "완벽한 하루였어요! 🔥";

    }

    else if (score >= 80) {

        document.getElementById("message").innerText =
            "정말 좋은 하루예요! 🌿";

    }

    else if (score >= 70) {

        document.getElementById("message").innerText =
            "괜찮은 하루였어요 🙂";

    }

    else {

        document.getElementById("message").innerText =
            "내일은 더 좋아질 거예요 🌱";

    }

}


/* LOAD */

const saved =
    localStorage.getItem("myDayData");


if (saved) {

    updateScreen(
        JSON.parse(saved)
    );

}

</script>


</body>
</html>
