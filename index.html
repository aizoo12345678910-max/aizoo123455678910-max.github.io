<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY DAY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b0f;
    color: #f5f7fa;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 25px 18px 70px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 4px;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.user-email {
    color: #8d9aaa;
    font-size: 12px;
}

.logout {
    background: #1b232c;
    color: white;
    border: 1px solid #303b47;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
}

.hero {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 25px;
    padding: 35px;
    text-align: center;
    margin-bottom: 18px;
}

.small-title {
    color: #8d9aaa;
    font-size: 12px;
    letter-spacing: 3px;
}

.score {
    font-size: 90px;
    font-weight: bold;
    color: #72f5a4;
    margin: 10px 0;
}

.message {
    font-size: 18px;
}

.main-button,
.save-button,
.auth-button {
    width: 100%;
    border: none;
    background: #72f5a4;
    color: #07100b;
    font-weight: bold;
    padding: 16px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 16px;
}

.main-button {
    margin-top: 22px;
}

.main-button:hover,
.save-button:hover,
.auth-button:hover {
    opacity: .85;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.card {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 20px;
    padding: 20px;
}

.icon {
    font-size: 25px;
}

.card-title {
    color: #8d9aaa;
    font-size: 13px;
    margin-top: 8px;
}

.value {
    font-size: 23px;
    font-weight: bold;
    margin-top: 5px;
}

.section {
    margin-top: 30px;
}

.section h2 {
    font-size: 19px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 18px;
    padding: 18px;
}

.stat-title {
    color: #8d9aaa;
    font-size: 12px;
}

.stat-value {
    font-size: 25px;
    font-weight: bold;
    margin-top: 8px;
    color: #72f5a4;
}

.chart {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 20px;
    padding: 22px;
}

.chart-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
}

.chart-date {
    width: 65px;
    color: #9aa6b5;
    font-size: 12px;
}

.chart-bar {
    flex: 1;
    height: 28px;
    background: #1c252e;
    border-radius: 8px;
    overflow: hidden;
}

.chart-inner {
    height: 100%;
    background: #72f5a4;
    border-radius: 8px;
}

.chart-score {
    width: 35px;
    text-align: right;
    font-size: 12px;
}

.history {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.history-item {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 16px;
    padding: 16px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-date {
    color: #9aa6b5;
    font-size: 13px;
}

.history-note {
    margin-top: 5px;
    color: #d7dce3;
    font-size: 14px;
}

.history-score {
    font-size: 25px;
    font-weight: bold;
    color: #72f5a4;
}

.insight {
    background: linear-gradient(
        135deg,
        #111d17,
        #11161d
    );

    border: 1px solid #24412f;
    border-radius: 20px;
    padding: 25px;
}

.insight-title {
    color: #72f5a4;
    font-weight: bold;
    margin-bottom: 10px;
}

.insight-text {
    color: #d6dce3;
    line-height: 1.7;
}

.empty {
    color: #718092;
    text-align: center;
    padding: 25px;
}


/* LOGIN */

.auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-box {
    width: 100%;
    max-width: 420px;
    background: #11161d;
    border: 1px solid #293440;
    border-radius: 25px;
    padding: 30px;
}

.auth-logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 5px;
    margin-bottom: 10px;
}

.auth-subtitle {
    text-align: center;
    color: #8d9aaa;
    margin-bottom: 25px;
}

.auth-input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    background: #080b0f;
    border: 1px solid #28323d;
    border-radius: 10px;
    color: white;
    font-size: 15px;
}

.auth-button {
    margin-top: 5px;
}

.auth-switch {
    text-align: center;
    color: #8d9aaa;
    margin-top: 18px;
    cursor: pointer;
    font-size: 14px;
}

.auth-message {
    color: #72f5a4;
    text-align: center;
    margin-top: 15px;
    line-height: 1.5;
}

.auth-error {
    color: #ff7777;
    text-align: center;
    margin-top: 15px;
    line-height: 1.5;
}


/* MODAL */

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 100;
}

.modal {
    width: 100%;
    max-width: 520px;

    background: #11161d;

    border: 1px solid #293440;

    border-radius: 24px;

    padding: 25px;

    max-height: 90vh;

    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
}

.close {
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
}

.field {
    margin-top: 18px;
}

.field label {
    display: block;
    color: #9aa6b5;
    font-size: 13px;
    margin-bottom: 7px;
}

.field input,
.field textarea {

    width: 100%;

    padding: 13px;

    background: #080b0f;

    border: 1px solid #28323d;

    border-radius: 10px;

    color: white;

    font-size: 15px;
}

.field textarea {
    min-height: 80px;
    resize: vertical;
}

.range-row {
    display: flex;
    gap: 10px;
    align-items: center;
}

.range-row input {
    flex: 1;
}

.range-number {
    width: 45px;
    text-align: center;
    color: #72f5a4;
    font-weight: bold;
}

.save-button {
    margin-top: 25px;
}

@media(max-width:800px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media(max-width:700px) {

    .cards {
        grid-template-columns: repeat(2,1fr);
    }

    .score {
        font-size: 70px;
    }

    .user-email {
        display: none;
    }

}

@media(max-width:450px) {

    .cards {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .hero {
        padding: 25px 15px;
    }

}

</style>
</head>


<body>


<!-- LOGIN SCREEN -->

<div id="authScreen" class="auth-screen">

    <div class="auth-box">

        <div class="auth-logo">
            MY DAY
        </div>

        <div
            class="auth-subtitle"
            id="authTitle"
        >
            나의 하루를 기록하세요
        </div>

        <input
            class="auth-input"
            type="email"
            id="email"
            placeholder="이메일"
        >

        <input
            class="auth-input"
            type="password"
            id="password"
            placeholder="비밀번호"
        >

        <button
            class="auth-button"
            id="authButton"
            onclick="handleAuth()"
        >
            로그인
        </button>

        <div
            class="auth-switch"
            id="authSwitch"
            onclick="toggleAuthMode()"
        >
            처음이신가요? 회원가입
        </div>

        <div
            id="authMessage"
            class="auth-message"
        ></div>

        <div
            id="authError"
            class="auth-error"
        ></div>

    </div>

</div>


<!-- MAIN APP -->

<div
    id="app"
    style="display:none;"
>


<div class="container">


    <div class="header">

        <div class="logo">
            MY DAY
        </div>

        <div class="user-area">

            <div
                class="user-email"
                id="userEmail"
            ></div>

            <button
                class="logout"
                onclick="logout()"
            >
                로그아웃
            </button>

        </div>

    </div>


    <div class="hero">

        <div class="small-title">
            TODAY SCORE
        </div>

        <div
            class="score"
            id="score"
        >
            0
        </div>

        <div
            class="message"
            id="message"
        >
            오늘의 데이터를 입력해보세요 🌱
        </div>

        <button
            class="main-button"
            onclick="openModal()"
        >
            ＋ 오늘 기록하기
        </button>

    </div>


    <div class="cards">


        <div class="card">

            <div class="icon">😴</div>

            <div class="card-title">
                수면
            </div>

            <div
                class="value"
                id="sleepValue"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">📚</div>

            <div class="card-title">
                공부
            </div>

            <div
                class="value"
                id="studyValue"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">🏃</div>

            <div class="card-title">
                운동
            </div>

            <div
                class="value"
                id="exerciseValue"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">😊</div>

            <div class="card-title">
                기분
            </div>

            <div
                class="value"
                id="moodValue"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">⚡</div>

            <div class="card-title">
                집중도
            </div>

            <div
                class="value"
                id="focusValue"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">💰</div>

            <div class="card-title">
                오늘 지출
            </div>

            <div
                class="value"
                id="moneyValue"
            >
                -
            </div>

        </div>


    </div>


    <div class="section">

        <h2>
            📈 나의 기록
        </h2>

        <div class="stats">


            <div class="stat">

                <div class="stat-title">
                    평균 점수
                </div>

                <div
                    class="stat-value"
                    id="averageScore"
                >
                    0점
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    최고 점수
                </div>

                <div
                    class="stat-value"
                    id="bestScore"
                >
                    0점
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    누적 공부
                </div>

                <div
                    class="stat-value"
                    id="totalStudy"
                >
                    0시간
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    누적 운동
                </div>

                <div
                    class="stat-value"
                    id="totalExercise"
                >
                    0시간
                </div>

            </div>


        </div>

    </div>


    <div class="section">

        <h2>
            📊 최근 기록
        </h2>

        <div
            class="chart"
            id="chart"
        >

            <div class="empty">
                아직 기록이 없습니다.
            </div>

        </div>

    </div>


    <div class="section">

        <h2>
            🧠 MY INSIGHT
        </h2>

        <div class="insight">

            <div class="insight-title">
                오늘의 분석
            </div>

            <div
                class="insight-text"
                id="insight"
            >
                기록을 쌓으면
                나만의 생활 패턴을 분석해드려요.
            </div>

        </div>

    </div>


    <div class="section">

        <h2>
            📅 기록 히스토리
        </h2>

        <div
            class="history"
            id="history"
        >

            <div class="empty">
                아직 기록이 없습니다.
            </div>

        </div>

    </div>


</div>


</div>


<!-- RECORD MODAL -->

<div
    class="modal-bg"
    id="modalBg"
>


<div class="modal">


    <div class="modal-header">

        <h2>
            오늘 기록하기
        </h2>

        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>

    </div>


    <div class="field">

        <label>
            수면 시간 (시간)
        </label>

        <input
            type="number"
            id="sleep"
            min="0"
            max="24"
            step="0.1"
            placeholder="예: 7.5"
        >

    </div>


    <div class="field">

        <label>
            공부 시간 (분)
        </label>

        <input
            type="number"
            id="study"
            min="0"
            placeholder="예: 120"
        >

    </div>


    <div class="field">

        <label>
            운동 시간 (분)
        </label>

        <input
            type="number"
            id="exercise"
            min="0"
            placeholder="예: 45"
        >

    </div>


    <div class="field">

        <label>
            오늘 지출 (원)
        </label>

        <input
            type="number"
            id="money"
            min="0"
            placeholder="예: 23000"
        >

    </div>


    <div class="field">

        <label>
            기분
        </label>

        <div class="range-row">

            <input
                type="range"
                min="0"
                max="100"
                value="70"
                id="mood"
                oninput="updateMood()"
            >

            <div
                class="range-number"
                id="moodNumber"
            >
                70
            </div>

        </div>

    </div>


    <div class="field">

        <label>
            집중도
        </label>

        <div class="range-row">

            <input
                type="range"
                min="0"
                max="100"
                value="70"
                id="focus"
                oninput="updateFocus()"
            >

            <div
                class="range-number"
                id="focusNumber"
            >
                70
            </div>

        </div>

    </div>


    <div class="field">

        <label>
            오늘 한마디
        </label>

        <textarea
            id="note"
            placeholder="오늘 하루는 어땠나요?"
        ></textarea>

    </div>


    <button
        class="save-button"
        onclick="saveRecord()"
    >
        클라우드에 저장하기
    </button>


</div>

</div>


<script>


/* =========================
   SUPABASE 설정
========================= */

const SUPABASE_URL =
    "https://raasbxkmehjprsjmjxtj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_BALs2dGrARhYLLa3-5Uc9Q_UAHF_4Vh";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   상태
========================= */

let isSignup = false;

let currentUser = null;

let records = [];


/* =========================
   인증 화면 전환
========================= */

function toggleAuthMode() {

    isSignup = !isSignup;

    const title =
        document.getElementById("authTitle");

    const button =
        document.getElementById("authButton");

    const switchText =
        document.getElementById("authSwitch");

    clearAuthMessages();


    if (isSignup) {

        title.innerText =
            "MY DAY 계정을 만들어보세요";

        button.innerText =
            "회원가입";

        switchText.innerText =
            "이미 계정이 있나요? 로그인";

    } else {

        title.innerText =
            "나의 하루를 기록하세요";

        button.innerText =
            "로그인";

        switchText.innerText =
            "처음이신가요? 회원가입";

    }

}


/* =========================
   메시지
========================= */

function clearAuthMessages() {

    document.getElementById(
        "authMessage"
    ).innerText = "";

    document.getElementById(
        "authError"
    ).innerText = "";

}


/* =========================
   회원가입 / 로그인
========================= */

async function handleAuth() {

    clearAuthMessages();

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if (!email || !password) {

        document.getElementById(
            "authError"
        ).innerText =
            "이메일과 비밀번호를 입력해주세요.";

        return;

    }


    if (password.length < 6) {

        document.getElementById(
            "authError"
        ).innerText =
            "비밀번호는 6자 이상이어야 합니다.";

        return;

    }


    const button =
        document.getElementById(
            "authButton"
        );

    button.disabled = true;

    button.innerText =
        "처리 중...";


    try {


        if (isSignup) {

            const {
                data,
                error
            } =
            await supabaseClient.auth.signUp({
                email,
                password
            });


            if (error) {
                throw error;
            }


            document.getElementById(
                "authMessage"
            ).innerText =
                "회원가입이 완료되었습니다. 이메일 인증이 필요한 경우 메일함에서 인증 후 로그인해주세요.";

        } else {


            const {
                data,
                error
            } =
            await supabaseClient.auth.signInWithPassword({
                email,
                password
            });


            if (error) {
                throw error;
            }


            if (data.user) {

                currentUser =
                    data.user;

                showApp();

                await loadRecords();

            }

        }


    } catch (error) {

        document.getElementById(
            "authError"
        ).innerText =
            error.message ||
            "로그인 중 오류가 발생했습니다.";

    }


    button.disabled = false;

    button.innerText =
        isSignup
        ? "회원가입"
        : "로그인";

}


/* =========================
   로그아웃
========================= */

async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;

    records = [];

    document.getElementById(
        "app"
    ).style.display = "none";

    document.getElementById(
        "authScreen"
    ).style.display = "flex";

}


/* =========================
   앱 표시
========================= */

function showApp() {

    document.getElementById(
        "authScreen"
    ).style.display = "none";

    document.getElementById(
        "app"
    ).style.display = "block";

    document.getElementById(
        "userEmail"
    ).innerText =
        currentUser.email;

}


/* =========================
   날짜
========================= */

function getToday() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


document.getElementById(
    "date"
).innerText =
    new Date().toLocaleDateString(
        "ko-KR",
        {
            year: "numeric",
            month: "long",
            day: "numeric",
            weekday: "long"
        }
    );


/* =========================
   모달
========================= */

function openModal() {

    document.getElementById(
        "modalBg"
    ).style.display =
        "flex";

}


function closeModal() {

    document.getElementById(
        "modalBg"
    ).style.display =
        "none";

}


/* =========================
   슬라이더
========================= */

function updateMood() {

    document.getElementById(
        "moodNumber"
    ).innerText =
        document.getElementById(
            "mood"
        ).value;

}


function updateFocus() {

    document.getElementById(
        "focusNumber"
    ).innerText =
        document.getElementById(
            "focus"
        ).value;

}


/* =========================
   점수
========================= */

function calculateScore(
    sleep,
    study,
    exercise,
    mood,
    focus
) {

    let sleepScore =
        Math.min(
            100,
            Math.max(
                0,
                100 -
                Math.abs(
                    8 - sleep
                ) * 20
            )
        );


    let studyScore =
        Math.min(
            100,
            study / 180 * 100
        );


    let exerciseScore =
        Math.min(
            100,
            exercise / 60 * 100
        );


    return Math.round(
        sleepScore * 0.20 +
        studyScore * 0.15 +
        exerciseScore * 0.15 +
        mood * 0.25 +
        focus * 0.25
    );

}


/* =========================
   기록 저장
========================= */

async function saveRecord() {

    if (!currentUser) {

        alert(
            "먼저 로그인해주세요."
        );

        return;

    }


    const sleep =
        Number(
            document.getElementById(
                "sleep"
            ).value
        );


    const study =
        Number(
            document.getElementById(
                "study"
            ).value
        ) || 0;


    const exercise =
        Number(
            document.getElementById(
                "exercise"
            ).value
        ) || 0;


    const money =
        Number(
            document.getElementById(
                "money"
            ).value
        ) || 0;


    const mood =
        Number(
            document.getElementById(
                "mood"
            ).value
        );


    const focus =
        Number(
            document.getElementById(
                "focus"
            ).value
        );


    const note =
        document.getElementById(
            "note"
        ).value;


    if (!sleep) {

        alert(
            "수면 시간을 입력해주세요."
        );

        return;

    }


    const score =
        calculateScore(
            sleep,
            study,
            exercise,
            mood,
            focus
        );


    const record = {

        user_id:
            currentUser.id,

        record_date:
            getToday(),

        sleep,

        study,

        exercise,

        money,

        mood,

        focus,

        note,

        score

    };


    const button =
        document.querySelector(
            ".save-button"
        );


    button.disabled = true;

    button.innerText =
        "저장 중...";


    try {


        const {
            error
        } =
        await supabaseClient
            .from("daily_records")
            .upsert(
                record,
                {
                    onConflict:
                        "user_id,record_date"
                }
            );


        if (error) {
            throw error;
        }


        alert(
            "☁️ 기록이 저장되었습니다!"
        );


        closeModal();


        await loadRecords();


    } catch (error) {

        alert(
            "저장 실패: "
            + error.message
        );

    }


    button.disabled = false;

    button.innerText =
        "클라우드에 저장하기";

}


/* =========================
   기록 불러오기
========================= */

async function loadRecords() {

    if (!currentUser) {
        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("daily_records")
        .select("*")
        .eq(
            "user_id",
            currentUser.id
        )
        .order(
            "record_date",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        alert(
            "기록을 불러오지 못했습니다."
        );

        return;

    }


    records =
        data || [];


    updateAll();

}


/* =========================
   전체 화면 업데이트
========================= */

function updateAll() {

    if (
        !records ||
        records.length === 0
    ) {

        return;

    }


    updateToday(
        records[0]
    );

    updateStats();

    updateChart();

    updateHistory();

    updateInsight();

}


/* =========================
   오늘
========================= */

function updateToday(data) {

    document.getElementById(
        "sleepValue"
    ).innerText =
        data.sleep + "시간";


    document.getElementById(
        "studyValue"
    ).innerText =
        data.study + "분";


    document.getElementById(
        "exerciseValue"
    ).innerText =
        data.exercise + "분";


    document.getElementById(
        "moodValue"
    ).innerText =
        data.mood + "점";


    document.getElementById(
        "focusValue"
    ).innerText =
        data.focus + "점";


    document.getElementById(
        "moneyValue"
    ).innerText =
        Number(
            data.money
        ).toLocaleString()
        + "원";


    document.getElementById(
        "score"
    ).innerText =
        data.score;


    if (data.score >= 90) {

        document.getElementById(
            "message"
        ).innerText =
            "완벽한 하루였어요! 🔥";

    }

    else if (data.score >= 80) {

        document.getElementById(
            "message"
        ).innerText =
            "정말 좋은 하루예요! 🌿";

    }

    else if (data.score >= 70) {

        document.getElementById(
            "message"
        ).innerText =
            "괜찮은 하루였어요 🙂";

    }

    else {

        document.getElementById(
            "message"
        ).innerText =
            "내일은 더 좋아질 거예요 🌱";

    }

}


/* =========================
   통계
========================= */

function updateStats() {

    const scores =
        records.map(
            item =>
                Number(item.score)
        );


    const average =
        Math.round(
            scores.reduce(
                (a,b) => a+b,
                0
            ) / scores.length
        );


    const best =
        Math.max(...scores);


    const totalStudy =
        records.reduce(
            (sum,item) =>
                sum +
                Number(item.study),
            0
        );


    const totalExercise =
        records.reduce(
            (sum,item) =>
                sum +
                Number(item.exercise),
            0
        );


    document.getElementById(
        "averageScore"
    ).innerText =
        average + "점";


    document.getElementById(
        "bestScore"
    ).innerText =
        best + "점";


    document.getElementById(
        "totalStudy"
    ).innerText =
        (totalStudy / 60)
        .toFixed(1)
        + "시간";


    document.getElementById(
        "totalExercise"
    ).innerText =
        (totalExercise / 60)
        .toFixed(1)
        + "시간";

}


/* =========================
   그래프
========================= */

function updateChart() {

    const chart =
        document.getElementById(
            "chart"
        );


    const recent =
        records.slice(
            0,
            7
        );


    if (
        recent.length === 0
    ) {

        chart.innerHTML =
            '<div class="empty">아직 기록이 없습니다.</div>';

        return;

    }


    chart.innerHTML = "";


    recent
        .slice()
        .reverse()
        .forEach(
            item => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "chart-row";


                const date =
                    document.createElement(
                        "div"
                    );

                date.className =
                    "chart-date";

                date.innerText =
                    item.record_date
                        .slice(5);


                const bar =
                    document.createElement(
                        "div"
                    );

                bar.className =
                    "chart-bar";


                const inner =
                    document.createElement(
                        "div"
                    );

                inner.className =
                    "chart-inner";

                inner.style.width =
                    item.score + "%";


                const score =
                    document.createElement(
                        "div"
                    );

                score.className =
                    "chart-score";

                score.innerText =
                    item.score;


                bar.appendChild(
                    inner
                );

                row.appendChild(
                    date
                );

                row.appendChild(
                    bar
                );

                row.appendChild(
                    score
                );

                chart.appendChild(
                    row
                );

            }
        );

}


/* =========================
   히스토리
========================= */

function updateHistory() {

    const box =
        document.getElementById(
            "history"
        );


    box.innerHTML = "";


    records
        .slice(
            0,
            10
        )
        .forEach(
            item => {

                const element =
                    document.createElement(
                        "div"
                    );

                element.className =
                    "history-item";


                const left =
                    document.createElement(
                        "div"
                    );


                const date =
                    document.createElement(
                        "div"
                    );

                date.className =
                    "history-date";

                date.innerText =
                    item.record_date;


                const note =
                    document.createElement(
                        "div"
                    );

                note.className =
                    "history-note";

                note.innerText =
                    item.note ||
                    "오늘의 기록";


                left.appendChild(
                    date
                );

                left.appendChild(
                    note
                );


                const score =
                    document.createElement(
                        "div"
                    );

                score.className =
                    "history-score";

                score.innerText =
                    item.score;


                element.appendChild(
                    left
                );

                element.appendChild(
                    score
                );


                box.appendChild(
                    element
                );

            }
        );

}


/* =========================
   인사이트
========================= */

function updateInsight() {

    const insight =
        document.getElementById(
            "insight"
        );


    if (
        records.length < 2
    ) {

        insight.innerText =
            "기록이 2일 이상 쌓이면 생활 패턴을 분석해드려요.";

        return;

    }


    const avgSleep =
        records.reduce(
            (sum,item) =>
                sum +
                Number(item.sleep),
            0
        ) / records.length;


    const avgFocus =
        records.reduce(
            (sum,item) =>
                sum +
                Number(item.focus),
            0
        ) / records.length;


    const avgMood =
        records.reduce(
            (sum,item) =>
                sum +
                Number(item.mood),
            0
        ) / records.length;


    insight.innerText =
        "지금까지 평균 수면은 "
        + avgSleep.toFixed(1)
        + "시간, 평균 집중도는 "
        + Math.round(avgFocus)
        + "점, 평균 기분은 "
        + Math.round(avgMood)
        + "점이에요. 기록이 더 쌓이면 MY DAY가 생활 패턴을 더 자세히 분석할 수 있어요.";

}


/* =========================
   로그인 상태 확인
========================= */

async function checkSession() {

    const {
        data
    } =
    await supabaseClient
        .auth
        .getSession();


    if (
        data &&
        data.session &&
        data.session.user
    ) {

        currentUser =
            data.session.user;

        showApp();

        await loadRecords();

    }

}


/* =========================
   로그인 상태 변화 감지
========================= */

supabaseClient
    .auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {

            if (
                session &&
                session.user
            ) {

                currentUser =
                    session.user;

                showApp();

                await loadRecords();

            }

        }
    );


/* 시작 */

checkSession();

</script>
