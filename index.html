<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY DAY</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b0f;
    color: #f5f7fa;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 25px 18px 70px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 4px;
}

.date {
    color: #8d9aaa;
    font-size: 13px;
}

.hero {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 25px;
    padding: 35px;
    text-align: center;
    margin-bottom: 18px;
}

.small-title {
    color: #8d9aaa;
    font-size: 12px;
    letter-spacing: 3px;
}

.score {
    font-size: 90px;
    font-weight: bold;
    color: #72f5a4;
    margin: 10px 0;
}

.message {
    font-size: 18px;
}

.main-button {
    width: 100%;
    border: none;
    background: #72f5a4;
    color: #07100b;
    font-weight: bold;
    padding: 16px;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 22px;
    font-size: 16px;
}

.main-button:hover {
    opacity: .85;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.card {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 20px;
    padding: 20px;
}

.icon {
    font-size: 25px;
}

.card-title {
    color: #8d9aaa;
    font-size: 13px;
    margin-top: 8px;
}

.value {
    font-size: 23px;
    font-weight: bold;
    margin-top: 5px;
}

.section {
    margin-top: 30px;
}

.section h2 {
    font-size: 19px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 18px;
    padding: 18px;
}

.stat-title {
    color: #8d9aaa;
    font-size: 12px;
}

.stat-value {
    font-size: 25px;
    font-weight: bold;
    margin-top: 8px;
    color: #72f5a4;
}

.chart {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 20px;
    padding: 22px;
}

.chart-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
}

.chart-date {
    width: 65px;
    color: #9aa6b5;
    font-size: 12px;
}

.chart-bar {
    flex: 1;
    height: 28px;
    background: #1c252e;
    border-radius: 8px;
    overflow: hidden;
}

.chart-inner {
    height: 100%;
    background: #72f5a4;
    border-radius: 8px;
    transition: width .5s;
}

.chart-score {
    width: 35px;
    text-align: right;
    font-size: 12px;
}

.history {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.history-item {
    background: #11161d;
    border: 1px solid #222b35;
    border-radius: 16px;
    padding: 16px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-date {
    color: #9aa6b5;
    font-size: 13px;
}

.history-note {
    margin-top: 5px;
    color: #d7dce3;
    font-size: 14px;
}

.history-score {
    font-size: 25px;
    font-weight: bold;
    color: #72f5a4;
}

.insight {
    background: linear-gradient(
        135deg,
        #111d17,
        #11161d
    );

    border: 1px solid #24412f;

    border-radius: 20px;

    padding: 25px;
}

.insight-title {
    color: #72f5a4;
    font-weight: bold;
    margin-bottom: 10px;
}

.insight-text {
    color: #d6dce3;
    line-height: 1.7;
}

.empty {
    color: #718092;
    text-align: center;
    padding: 25px;
}


/* MODAL */

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 100;
}

.modal {
    width: 100%;
    max-width: 520px;

    background: #11161d;

    border: 1px solid #293440;

    border-radius: 24px;

    padding: 25px;

    max-height: 90vh;

    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
}

.close {
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
}

.field {
    margin-top: 18px;
}

.field label {
    display: block;
    color: #9aa6b5;
    font-size: 13px;
    margin-bottom: 7px;
}

.field input,
.field textarea {

    width: 100%;

    padding: 13px;

    background: #080b0f;

    border: 1px solid #28323d;

    border-radius: 10px;

    color: white;

    font-size: 15px;
}

.field textarea {
    min-height: 80px;
    resize: vertical;
}

.range-row {
    display: flex;
    gap: 10px;
    align-items: center;
}

.range-row input {
    flex: 1;
}

.range-number {
    width: 45px;
    text-align: center;
    color: #72f5a4;
    font-weight: bold;
}

.save-button {

    width: 100%;

    border: none;

    background: #72f5a4;

    color: #07100b;

    font-weight: bold;

    padding: 15px;

    border-radius: 12px;

    cursor: pointer;

    margin-top: 25px;
}

@media(max-width:800px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media(max-width:700px) {

    .cards {
        grid-template-columns: repeat(2,1fr);
    }

    .score {
        font-size: 70px;
    }

}

@media(max-width:450px) {

    .cards {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .hero {
        padding: 25px 15px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="logo">
            MY DAY
        </div>

        <div class="date" id="date"></div>

    </div>


    <!-- TODAY -->

    <div class="hero">

        <div class="small-title">
            TODAY SCORE
        </div>

        <div class="score" id="score">
            0
        </div>

        <div class="message" id="message">
            오늘의 데이터를 입력해보세요 🌱
        </div>

        <button
            class="main-button"
            onclick="openModal()"
        >
            ＋ 오늘 기록하기
        </button>

    </div>


    <!-- TODAY DATA -->

    <div class="cards">


        <div class="card">

            <div class="icon">😴</div>

            <div class="card-title">
                수면
            </div>

            <div
                class="value"
                id="sleepValue"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">📚</div>

            <div class="card-title">
                공부
            </div>

            <div
                class="value"
                id="studyValue"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">🏃</div>

            <div class="card-title">
                운동
            </div>

            <div
                class="value"
                id="exerciseValue"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">😊</div>

            <div class="card-title">
                기분
            </div>

            <div
                class="value"
                id="moodValue"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">⚡</div>

            <div class="card-title">
                집중도
            </div>

            <div
                class="value"
                id="focusValue"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="icon">💰</div>

            <div class="card-title">
                오늘 지출
            </div>

            <div
                class="value"
                id="moneyValue"
            >
                -
            </div>

        </div>


    </div>


    <!-- STATS -->

    <div class="section">

        <h2>
            📈 나의 기록
        </h2>


        <div class="stats">


            <div class="stat">

                <div class="stat-title">
                    평균 점수
                </div>

                <div
                    class="stat-value"
                    id="averageScore"
                >
                    0점
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    최고 점수
                </div>

                <div
                    class="stat-value"
                    id="bestScore"
                >
                    0점
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    누적 공부
                </div>

                <div
                    class="stat-value"
                    id="totalStudy"
                >
                    0시간
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    누적 운동
                </div>

                <div
                    class="stat-value"
                    id="totalExercise"
                >
                    0시간
                </div>

            </div>


        </div>

    </div>


    <!-- CHART -->

    <div class="section">

        <h2>
            📊 최근 기록
        </h2>

        <div
            class="chart"
            id="chart"
        >

            <div class="empty">
                아직 기록이 없습니다.
            </div>

        </div>

    </div>


    <!-- INSIGHT -->

    <div class="section">

        <h2>
            🧠 MY INSIGHT
        </h2>

        <div class="insight">

            <div class="insight-title">
                오늘의 분석
            </div>

            <div
                class="insight-text"
                id="insight"
            >
                기록을 쌓으면
                나만의 생활 패턴을 분석해드려요.
            </div>

        </div>

    </div>


    <!-- HISTORY -->

    <div class="section">

        <h2>
            📅 기록 히스토리
        </h2>

        <div
            class="history"
            id="history"
        >

            <div class="empty">
                아직 기록이 없습니다.
            </div>

        </div>

    </div>


</div>


<!-- MODAL -->

<div
    class="modal-bg"
    id="modalBg"
>


<div class="modal">


    <div class="modal-header">

        <h2>
            오늘 기록하기
        </h2>

        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>

    </div>


    <div class="field">

        <label>
            수면 시간 (시간)
        </label>

        <input
            type="number"
            id="sleep"
            min="0"
            max="24"
            step="0.1"
            placeholder="예: 7.5"
        >

    </div>


    <div class="field">

        <label>
            공부 시간 (분)
        </label>

        <input
            type="number"
            id="study"
            min="0"
            placeholder="예: 120"
        >

    </div>


    <div class="field">

        <label>
            운동 시간 (분)
        </label>

        <input
            type="number"
            id="exercise"
            min="0"
            placeholder="예: 45"
        >

    </div>


    <div class="field">

        <label>
            오늘 지출 (원)
        </label>

        <input
            type="number"
            id="money"
            min="0"
            placeholder="예: 23000"
        >

    </div>


    <div class="field">

        <label>
            기분
        </label>

        <div class="range-row">

            <input
                type="range"
                min="0"
                max="100"
                value="70"
                id="mood"
                oninput="updateMood()"
            >

            <div
                class="range-number"
                id="moodNumber"
            >
                70
            </div>

        </div>

    </div>


    <div class="field">

        <label>
            집중도
        </label>

        <div class="range-row">

            <input
                type="range"
                min="0"
                max="100"
                value="70"
                id="focus"
                oninput="updateFocus()"
            >

            <div
                class="range-number"
                id="focusNumber"
            >
                70
            </div>

        </div>

    </div>


    <div class="field">

        <label>
            오늘 한마디
        </label>

        <textarea
            id="note"
            placeholder="오늘 하루는 어땠나요?"
        ></textarea>

    </div>


    <button
        class="save-button"
        onclick="saveData()"
    >
        저장하기
    </button>


</div>

</div>


<script>


/* DATE */

const today = new Date();

document.getElementById("date").innerText =
    today.toLocaleDateString(
        "ko-KR",
        {
            year: "numeric",
            month: "long",
            day: "numeric",
            weekday: "long"
        }
    );


/* MODAL */

function openModal() {

    document.getElementById("modalBg").style.display =
        "flex";

}


function closeModal() {

    document.getElementById("modalBg").style.display =
        "none";

}


/* RANGE */

function updateMood() {

    document.getElementById("moodNumber").innerText =
        document.getElementById("mood").value;

}


function updateFocus() {

    document.getElementById("focusNumber").innerText =
        document.getElementById("focus").value;

}


/* SCORE */

function calculateScore(
    sleep,
    study,
    exercise,
    mood,
    focus
) {

    let sleepScore =
        Math.min(
            100,
            Math.max(
                0,
                100 -
                Math.abs(8 - sleep) * 20
            )
        );


    let studyScore =
        Math.min(
            100,
            study / 180 * 100
        );


    let exerciseScore =
        Math.min(
            100,
            exercise / 60 * 100
        );


    let score =
        sleepScore * 0.2 +
        studyScore * 0.15 +
        exerciseScore * 0.15 +
        mood * 0.25 +
        focus * 0.25;


    return Math.round(score);

}


/* LOAD HISTORY */

function getHistory() {

    const saved =
        localStorage.getItem("myDayHistory");

    if (!saved) {
        return [];
    }

    try {

        return JSON.parse(saved);

    } catch {

        return [];

    }

}


/* SAVE */

function saveData() {


    const sleep =
        Number(
            document.getElementById("sleep").value
        );


    const study =
        Number(
            document.getElementById("study").value
        );


    const exercise =
        Number(
            document.getElementById("exercise").value
        );


    const money =
        Number(
            document.getElementById("money").value
        );


    const mood =
        Number(
            document.getElementById("mood").value
        );


    const focus =
        Number(
            document.getElementById("focus").value
        );


    const note =
        document.getElementById("note").value;


    if (!sleep) {

        alert("수면 시간을 입력해주세요.");

        return;

    }


    const date =
        new Date()
        .toISOString()
        .split("T")[0];


    const score =
        calculateScore(
            sleep,
            study,
            exercise,
            mood,
            focus
        );


    const record = {

        date,
        sleep,
        study,
        exercise,
        money,
        mood,
        focus,
        note,
        score

    };


    let history =
        getHistory();


    /* 같은 날짜 기록은 업데이트 */

    const existingIndex =
        history.findIndex(
            item => item.date === date
        );


    if (existingIndex >= 0) {

        history[existingIndex] =
            record;

    } else {

        history.push(record);

    }


    history.sort(
        (a,b) =>
            new Date(b.date) -
            new Date(a.date)
    );


    localStorage.setItem(
        "myDayHistory",
        JSON.stringify(history)
    );


    updateAll();


    closeModal();


    alert(
        "오늘 기록이 저장되었습니다! 🌱"
    );

}


/* UPDATE ALL */

function updateAll() {

    const history =
        getHistory();


    if (history.length === 0) {

        return;

    }


    const latest =
        history[0];


    updateToday(latest);

    updateStats(history);

    updateChart(history);

    updateHistory(history);

    updateInsight(history);

}


/* TODAY */

function updateToday(data) {


    document.getElementById("sleepValue").innerText =
        data.sleep + "시간";


    document.getElementById("studyValue").innerText =
        data.study + "분";


    document.getElementById("exerciseValue").innerText =
        data.exercise + "분";


    document.getElementById("moodValue").innerText =
        data.mood + "점";


    document.getElementById("focusValue").innerText =
        data.focus + "점";


    document.getElementById("moneyValue").innerText =
        data.money.toLocaleString() + "원";


    document.getElementById("score").innerText =
        data.score;


    if (data.score >= 90) {

        document.getElementById("message").innerText =
            "완벽한 하루였어요! 🔥";

    }

    else if (data.score >= 80) {

        document.getElementById("message").innerText =
            "정말 좋은 하루예요! 🌿";

    }

    else if (data.score >= 70) {

        document.getElementById("message").innerText =
            "괜찮은 하루였어요 🙂";

    }

    else {

        document.getElementById("message").innerText =
            "내일은 더 좋아질 거예요 🌱";

    }

}


/* STATS */

function updateStats(history) {


    const scores =
        history.map(
            item => item.score
        );


    const average =
        Math.round(
            scores.reduce(
                (a,b) => a+b,
                0
            ) / scores.length
        );


    const best =
        Math.max(...scores);


    const totalStudy =
        history.reduce(
            (sum,item) =>
                sum + Number(item.study),
            0
        );


    const totalExercise =
        history.reduce(
            (sum,item) =>
                sum + Number(item.exercise),
            0
        );


    document.getElementById(
        "averageScore"
    ).innerText =
        average + "점";


    document.getElementById(
        "bestScore"
    ).innerText =
        best + "점";


    document.getElementById(
        "totalStudy"
    ).innerText =
        (totalStudy / 60).toFixed(1)
        + "시간";


    document.getElementById(
        "totalExercise"
    ).innerText =
        (totalExercise / 60).toFixed(1)
        + "시간";

}


/* CHART */

function updateChart(history) {


    const chart =
        document.getElementById("chart");


    const recent =
        history.slice(0,7);


    if (recent.length === 0) {

        chart.innerHTML =
            '<div class="empty">아직 기록이 없습니다.</div>';

        return;

    }


    chart.innerHTML = "";


    recent
        .slice()
        .reverse()
        .forEach(item => {


            const row =
                document.createElement("div");


            row.className =
                "chart-row";


            const date =
                document.createElement("div");


            date.className =
                "chart-date";


            date.innerText =
                item.date.slice(5);


            const bar =
                document.createElement("div");


            bar.className =
                "chart-bar";


            const inner =
                document.createElement("div");


            inner.className =
                "chart-inner";


            inner.style.width =
                item.score + "%";


            const score =
                document.createElement("div");


            score.className =
                "chart-score";


            score.innerText =
                item.score;


            bar.appendChild(inner);


            row.appendChild(date);

            row.appendChild(bar);

            row.appendChild(score);


            chart.appendChild(row);

        });

}


/* HISTORY */

function updateHistory(history) {


    const box =
        document.getElementById(
            "history"
        );


    box.innerHTML = "";


    history
        .slice(0,10)
        .forEach(item => {


            const element =
                document.createElement("div");


            element.className =
                "history-item";


            const left =
                document.createElement("div");


            const date =
                document.createElement("div");


            date.className =
                "history-date";


            date.innerText =
                item.date;


            const note =
                document.createElement("div");


            note.className =
                "history-note";


            note.innerText =
                item.note ||
                "오늘의 기록";


            left.appendChild(date);

            left.appendChild(note);


            const score =
                document.createElement("div");


            score.className =
                "history-score";


            score.innerText =
                item.score;


            element.appendChild(left);

            element.appendChild(score);


            box.appendChild(element);

        });

}


/* INSIGHT */

function updateInsight(history) {


    const insight =
        document.getElementById(
            "insight"
        );


    if (history.length < 2) {

        insight.innerText =
            "기록이 2일 이상 쌓이면 생활 패턴을 분석해드려요.";

        return;

    }


    const avgSleep =
        history.reduce(
            (sum,item) =>
                sum + Number(item.sleep),
            0
        ) / history.length;


    const avgFocus =
        history.reduce(
            (sum,item) =>
                sum + Number(item.focus),
            0
        ) / history.length;


    const avgMood =
        history.reduce(
            (sum,item) =>
                sum + Number(item.mood),
            0
        ) / history.length;


    insight.innerText =
        "최근 기록을 보면 평균 수면은 "
        + avgSleep.toFixed(1)
        + "시간, 평균 집중도는 "
        + Math.round(avgFocus)
        + "점, 평균 기분은 "
        + Math.round(avgMood)
        + "점이에요. "
        + "기록이 더 쌓이면 수면·공부·운동과 집중도의 관계까지 분석할 수 있어요.";

}

updateAll();
